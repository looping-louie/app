services:
  app:
    build:
      context: .
      args:
        API_PROXY_TARGET: ${API_PROXY_TARGET:-http://host.docker.internal:8000}
    ports:
      - "3000:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://127.0.0.1:3000/"]
      interval: 30s
      start_period: 10s
      timeout: 5s
      retries: 3
